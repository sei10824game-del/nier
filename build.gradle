plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.1.0'
group = 'com.nier.automata'
base { archivesName = 'nierautomata' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
            if (project.hasProperty('preview')) { args '--quickPlaySingleplayer', 'preview', '--width', '960', '--height', '640'; jvmArg '-Dnier.preview=1'; jvmArg "-Dnier.preview.ids=${project.findProperty('previewIds') ?: ''}"; jvmArg "-Dnier.preview.dist=${project.findProperty('previewDist') ?: '1'}"; jvmArg "-Dnier.preview.skills=${project.findProperty('previewSkills') ?: '3'}" }
            mods { nierautomata { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'
            mods { nierautomata { source sourceSets.main } } }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.named('jar') { archiveClassifier = '' }
